version: '3.8'
services:
  app:
    build: .
    volumes:
      - ./:/var/www/html
    ports:
      - "9000:9000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=program_schedule
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - APP_TIMEZONE=Asia/Shanghai
    depends_on:
      - db

  web:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: program_schedule
    volumes:
      - db_data:/var/lib/mysql
      - ./create_database.sql:/docker-entrypoint-initdb.d/create_database.sql:ro

volumes:
  db_data:
